<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recap Studio Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', 'Padauk', sans-serif;
            background: #07090e;
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
        }
        .panel {
            background: #111520;
            border: 1px solid #1e2536;
        }
        .voice-active {
            background: #1d4ed8 !important;
            border-color: #60a5fa !important;
            color: #ffffff !important;
        }
        input[type=range] {
            accent-color: #38bdf8;
        }
        button { cursor: pointer; touch-action: manipulation; }
    </style>
</head>
<body class="pb-16">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-[#07090e]/90 backdrop-blur border-b border-slate-800/80 px-4 py-3">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center">
                    <i class="fa-solid fa-film text-white text-sm"></i>
                </div>
                <span class="font-extrabold text-sm tracking-wide">RECAP STUDIO</span>
            </div>
            <span id="headerStatus" class="text-[11px] font-bold px-2.5 py-1 rounded-full bg-slate-800 text-slate-300">READY</span>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 mt-5 space-y-4">

        <!-- 1. Source -->
        <section class="panel rounded-2xl p-4 space-y-3">
            <div class="flex items-center justify-between gap-2">
                <span class="text-xs font-extrabold uppercase tracking-wider text-slate-400">1. Source</span>
                <label class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-3.5 py-2 rounded-xl flex items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-upload"></i>
                    <span id="fileLabel">Upload MP4</span>
                    <input type="file" id="movieFile" accept="video/*" class="hidden" onchange="onVideoLoaded(this)">
                </label>
            </div>
            <div class="flex flex-col sm:flex-row gap-2">
                <input type="text" id="videoTitle" placeholder="Movie Title / Story Prompt..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-blue-500">
                <select id="platformPreset" onchange="updateLivePreview()" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs">
                    <option value="tiktok">9:16 TikTok</option>
                    <option value="youtube">16:9 YouTube</option>
                </select>
            </div>
        </section>

        <!-- 2. Voice -->
        <section class="panel rounded-2xl p-4 space-y-3">
            <div class="flex items-center justify-between">
                <span class="text-xs font-extrabold uppercase tracking-wider text-slate-400">2. Voice</span>
                <span id="selectedVoiceBadge" class="text-xs font-bold text-sky-400">Puck</span>
            </div>
            <div class="grid grid-cols-3 sm:grid-cols-6 gap-2">
                <button type="button" onclick="pickVoice(this, 'Puck')" class="voice-btn voice-active bg-slate-900 border border-slate-800 py-2.5 rounded-xl text-xs font-bold">Puck</button>
                <button type="button" onclick="pickVoice(this, 'Charon')" class="voice-btn bg-slate-900 border border-slate-800 py-2.5 rounded-xl text-xs font-bold">Charon</button>
                <button type="button" onclick="pickVoice(this, 'Fenrir')" class="voice-btn bg-slate-900 border border-slate-800 py-2.5 rounded-xl text-xs font-bold">Fenrir</button>
                <button type="button" onclick="pickVoice(this, 'Aoede')" class="voice-btn bg-slate-900 border border-slate-800 py-2.5 rounded-xl text-xs font-bold">Aoede</button>
                <button type="button" onclick="pickVoice(this, 'Kore')" class="voice-btn bg-slate-900 border border-slate-800 py-2.5 rounded-xl text-xs font-bold">Kore</button>
                <button type="button" onclick="pickVoice(this, 'Leda')" class="voice-btn bg-slate-900 border border-slate-800 py-2.5 rounded-xl text-xs font-bold">Leda</button>
            </div>
        </section>

        <!-- 3. Subtitle & Blur Studio (Live Preview + Full Control) -->
        <section class="panel rounded-2xl p-4 space-y-4">
            <div class="flex items-center justify-between">
                <span class="text-xs font-extrabold uppercase tracking-wider text-slate-400">3. Subtitle & Blur Mask</span>
                <div class="flex gap-1.5">
                    <button type="button" id="btnAutoMask" onclick="setMaskMode('auto')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-sky-600 text-white">Auto Blur</button>
                    <button type="button" id="btnCustomMask" onclick="setMaskMode('custom')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-800 text-slate-300">Custom</button>
                </div>
            </div>

            <!-- Live Canvas Preview -->
            <div class="bg-black rounded-xl border border-slate-800 p-2 flex justify-center">
                <canvas id="previewCanvas" class="max-h-[300px] w-auto rounded-lg"></canvas>
            </div>

            <!-- Controls Grid -->
            <div class="grid grid-cols-2 gap-3 text-xs">
                <!-- Subtitle Y Position -->
                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/80 space-y-1.5">
                    <div class="flex justify-between text-[11px] text-slate-400">
                        <span>Subtitle Y</span>
                        <span id="valSubY" class="text-white font-bold">78%</span>
                    </div>
                    <input type="range" id="subY" min="15" max="92" value="78" oninput="syncControls()" class="w-full">
                </div>

                <!-- Subtitle Size -->
                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/80 space-y-1.5">
                    <div class="flex justify-between text-[11px] text-slate-400">
                        <span>Text Size</span>
                        <span id="valSubSize" class="text-white font-bold">30px</span>
                    </div>
                    <input type="range" id="subSize" min="18" max="48" value="30" oninput="syncControls()" class="w-full">
                </div>

                <!-- Blur Strength -->
                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/80 space-y-1.5">
                    <div class="flex justify-between text-[11px] text-slate-400">
                        <span>Blur Strength</span>
                        <span id="valBlur" class="text-white font-bold">18px</span>
                    </div>
                    <input type="range" id="blurStrength" min="0" max="40" value="18" oninput="syncControls()" class="w-full">
                </div>

                <!-- Mask Height (Zoom/Scale) -->
                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/80 space-y-1.5">
                    <div class="flex justify-between text-[11px] text-slate-400">
                        <span>Mask Height</span>
                        <span id="valMaskH" class="text-white font-bold">14%</span>
                    </div>
                    <input type="range" id="maskH" min="6" max="35" value="14" oninput="syncControls()" class="w-full">
                </div>
            </div>

            <!-- Custom Mask Extra Sliders (Shown when Custom is active) -->
            <div id="customMaskPanel" class="hidden grid grid-cols-2 gap-3 text-xs pt-1 border-t border-slate-800/80">
                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/80 space-y-1.5">
                    <div class="flex justify-between text-[11px] text-slate-400">
                        <span>Mask Y</span>
                        <span id="valMaskY" class="text-white font-bold">74%</span>
                    </div>
                    <input type="range" id="maskY" min="10" max="90" value="74" oninput="syncControls()" class="w-full">
                </div>
                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/80 space-y-1.5">
                    <div class="flex justify-between text-[11px] text-slate-400">
                        <span>Mask Width</span>
                        <span id="valMaskW" class="text-white font-bold">92%</span>
                    </div>
                    <input type="range" id="maskW" min="30" max="100" value="92" oninput="syncControls()" class="w-full">
                </div>
            </div>
        </section>

        <!-- Pipeline Verification -->
        <section class="panel rounded-2xl p-4 space-y-3">
            <div class="grid grid-cols-3 gap-2 text-center text-[11px] font-bold">
                <div id="st1" class="bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-400">1. Script: Idle</div>
                <div id="st2" class="bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-400">2. Audio: Idle</div>
                <div id="st3" class="bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-400">3. Render: Idle</div>
            </div>

            <div class="space-y-1">
                <div class="flex justify-between text-[11px] font-bold">
                    <span id="progressMsg" class="text-slate-300">Ready</span>
                    <span id="progressPct" class="text-sky-400">0%</span>
                </div>
                <div class="w-full h-2 bg-slate-950 rounded-full overflow-hidden">
                    <div id="progressFill" class="h-full w-0 bg-blue-500 transition-all duration-200"></div>
                </div>
            </div>

            <!-- Live Verification Box (Script + Audio Check) -->
            <div id="verifyBox" class="hidden space-y-2 pt-2 border-t border-slate-800">
                <textarea id="scriptOutput" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none"></textarea>
                <audio id="audioVerifyPlayer" controls class="w-full h-8"></audio>
            </div>
        </section>

        <!-- Action Button -->
        <button type="button" id="runBtn" onclick="startPipeline()" class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.99] text-white py-3.5 rounded-2xl font-extrabold text-sm shadow-lg transition">
            Generate Video
        </button>

        <!-- Output Section -->
        <section id="outputSection" class="hidden panel border-emerald-500/60 rounded-2xl p-4 space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-xs font-extrabold text-emerald-400 uppercase">Final Output</span>
                <span id="engineBadge" class="text-[11px] bg-emerald-500/20 text-emerald-300 px-2.5 py-0.5 rounded-full font-bold">Synced</span>
            </div>
            <div class="bg-black rounded-xl overflow-hidden flex justify-center">
                <video id="finalPlayer" controls playsinline class="max-h-[420px] w-auto"></video>
            </div>
            <button type="button" onclick="downloadOutput()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 py-3 rounded-xl font-extrabold text-xs">
                <i class="fa-solid fa-download mr-1.5"></i> Download Video
            </button>
        </section>

    </div>

    <video id="srcVideo" muted playsinline crossorigin="anonymous" class="hidden"></video>

    <script>
        let selectedVoice = 'Puck';
        let maskMode = 'auto';
        let finalBlob = null;
        let finalExt = 'mp4';

        function pickVoice(el, name) {
            selectedVoice = name;
            document.getElementById('selectedVoiceBadge').innerText = name;
            document.querySelectorAll('.voice-btn').forEach(b => b.classList.remove('voice-active'));
            el.classList.add('voice-active');
        }

        function setMaskMode(mode) {
            maskMode = mode;
            const autoBtn = document.getElementById('btnAutoMask');
            const customBtn = document.getElementById('btnCustomMask');
            const customPanel = document.getElementById('customMaskPanel');

            if (mode === 'auto') {
                autoBtn.className = "px-2.5 py-1 rounded-lg text-[11px] font-bold bg-sky-600 text-white";
                customBtn.className = "px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-800 text-slate-300";
                customPanel.classList.add('hidden');
            } else {
                customBtn.className = "px-2.5 py-1 rounded-lg text-[11px] font-bold bg-sky-600 text-white";
                autoBtn.className = "px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-800 text-slate-300";
                customPanel.classList.remove('hidden');
            }
            updateLivePreview();
        }

        function syncControls() {
            document.getElementById('valSubY').innerText = document.getElementById('subY').value + '%';
            document.getElementById('valSubSize').innerText = document.getElementById('subSize').value + 'px';
            document.getElementById('valBlur').innerText = document.getElementById('blurStrength').value + 'px';
            document.getElementById('valMaskH').innerText = document.getElementById('maskH').value + '%';
            document.getElementById('valMaskY').innerText = document.getElementById('maskY').value + '%';
            document.getElementById('valMaskW').innerText = document.getElementById('maskW').value + '%';
            updateLivePreview();
        }

        function onVideoLoaded(input) {
            if (input.files && input.files[0]) {
                document.getElementById('fileLabel').innerText = input.files[0].name;
                const srcVid = document.getElementById('srcVideo');
                srcVid.src = URL.createObjectURL(input.files[0]);
                srcVid.onloadeddata = () => {
                    srcVid.currentTime = Math.min(2, srcVid.duration / 3);
                };
                srcVid.onseeked = () => updateLivePreview();
            }
        }

        function getLayoutConfig() {
            const subY = parseInt(document.getElementById('subY').value) / 100;
            const subSize = parseInt(document.getElementById('subSize').value);
            const blurStrength = parseInt(document.getElementById('blurStrength').value);
            const maskH = parseInt(document.getElementById('maskH').value) / 100;

            // Auto mode locks mask directly behind subtitle position; Custom allows free X/Y/W/H
            const maskY = maskMode === 'auto' ? Math.max(0.05, subY - (maskH * 0.35)) : (parseInt(document.getElementById('maskY').value) / 100);
            const maskW = maskMode === 'auto' ? 0.92 : (parseInt(document.getElementById('maskW').value) / 100);

            return { subY, subSize, blurStrength, maskH, maskY, maskW };
        }

        function drawCompositeFrame(ctx, canvas, srcVid, platform, subtitleText, zoomFactor) {
            const cfg = getLayoutConfig();
            const w = canvas.width;
            const h = canvas.height;

            ctx.fillStyle = '#05070c';
            ctx.fillRect(0, 0, w, h);

            const hasVid = srcVid && srcVid.readyState >= 2;
            if (hasVid) {
                const vw = srcVid.videoWidth;
                const vh = srcVid.videoHeight;
                if (platform === 'tiktok') {
                    // Blurred ambient background
                    ctx.save();
                    ctx.filter = 'blur(20px) brightness(0.45)';
                    const bgScale = Math.max(w / vw, h / vh);
                    ctx.drawImage(srcVid, (w - vw * bgScale) / 2, (h - vh * bgScale) / 2, vw * bgScale, vh * bgScale);
                    ctx.restore();

                    // Sharp foreground clip
                    const fgW = w * zoomFactor;
                    const fgH = (vh / vw) * fgW;
                    ctx.drawImage(srcVid, (w - fgW) / 2, (h - fgH) / 2 - (h * 0.04), fgW, fgH);
                } else {
                    const sc = Math.max(w / vw, h / vh) * zoomFactor;
                    ctx.drawImage(srcVid, (w - vw * sc) / 2, (h - vh * sc) / 2, vw * sc, vh * sc);
                }
            } else {
                const g = ctx.createLinearGradient(0, 0, w, h);
                g.addColorStop(0, '#0f172a');
                g.addColorStop(1, '#1e1b4b');
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, w, h);
            }

            // Draw Blur Mask (Covers original hardsubs & creates clean backdrop)
            const boxW = w * cfg.maskW;
            const boxH = h * cfg.maskH;
            const boxX = (w - boxW) / 2;
            const boxY = h * cfg.maskY;

            ctx.save();
            ctx.beginPath();
            ctx.roundRect(boxX, boxY, boxW, boxH, 14);
            ctx.clip();

            if (hasVid && cfg.blurStrength > 0) {
                ctx.filter = `blur(${cfg.blurStrength}px) brightness(0.65)`;
                const vw = srcVid.videoWidth;
                const vh = srcVid.videoHeight;
                if (platform === 'tiktok') {
                    const fgW = w * zoomFactor;
                    const fgH = (vh / vw) * fgW;
                    ctx.drawImage(srcVid, (w - fgW) / 2, (h - fgH) / 2 - (h * 0.04), fgW, fgH);
                } else {
                    const sc = Math.max(w / vw, h / vh) * zoomFactor;
                    ctx.drawImage(srcVid, (w - vw * sc) / 2, (h - vh * sc) / 2, vw * sc, vh * sc);
                }
            }
            ctx.filter = 'none';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.restore();

            // Draw Synced Subtitle Text
            if (subtitleText) {
                const scaleRatio = w / 720;
                const fontSize = Math.round(cfg.subSize * scaleRatio);
                ctx.font = `bold ${fontSize}px Padauk, sans-serif`;
                ctx.textAlign = 'center';

                const maxTextW = boxW - 32;
                const words = subtitleText.split(' ');
                const lines = [];
                let line = '';
                for (let i = 0; i < words.length; i++) {
                    const test = line + words[i] + ' ';
                    if (ctx.measureText(test).width > maxTextW && i > 0) {
                        lines.push(line.trim());
                        line = words[i] + ' ';
                    } else {
                        line = test;
                    }
                }
                lines.push(line.trim());

                const lineH = fontSize * 1.35;
                const textStartY = h * cfg.subY;
                lines.forEach((l, idx) => {
                    ctx.fillStyle = idx === 0 ? '#fde047' : '#ffffff';
                    ctx.fillText(l, w / 2, textStartY + idx * lineH);
                });
            }
        }

        function updateLivePreview() {
            const canvas = document.getElementById('previewCanvas');
            const platform = document.getElementById('platformPreset').value;
            if (platform === 'tiktok') {
                canvas.width = 360;
                canvas.height = 640;
            } else {
                canvas.width = 640;
                canvas.height = 360;
            }
            const ctx = canvas.getContext('2d');
            const srcVid = document.getElementById('srcVideo');
            drawCompositeFrame(ctx, canvas, srcVid, platform, 'နမူနာ မြန်မာစာတန်းထိုး နေရာနှင့် Blur အနေအထား', 1.06);
        }

        function setStepBadge(num, state, label) {
            const el = document.getElementById('st' + num);
            el.innerText = label;
            if (state === 'running') el.className = "bg-amber-500/20 border border-amber-500/40 p-2.5 rounded-xl text-amber-300 animate-pulse";
            else if (state === 'ok') el.className = "bg-emerald-500/20 border border-emerald-500/40 p-2.5 rounded-xl text-emerald-300";
            else if (state === 'err') el.className = "bg-rose-500/20 border border-rose-500/40 p-2.5 rounded-xl text-rose-300";
        }

        function setBar(pct, msg) {
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressPct').innerText = pct + '%';
            document.getElementById('progressMsg').innerText = msg;
        }

        async function startPipeline() {
            const fileInput = document.getElementById('movieFile').files[0];
            const titleInput = document.getElementById('videoTitle').value.trim();
            const platform = document.getElementById('platformPreset').value;

            if (!fileInput && !titleInput) {
                alert('MP4 ဖိုင် သို့မဟုတ် ဇာတ်ကားနာမည် ထည့်ပါ။');
                return;
            }

            const btn = document.getElementById('runBtn');
            btn.disabled = true;
            btn.classList.add('opacity-50');
            document.getElementById('outputSection').classList.add('hidden');
            document.getElementById('verifyBox').classList.add('hidden');

            try {
                // --- STEP 1: STRICT SCRIPT VERIFICATION ---
                setStepBadge(1, 'running', '1. Script: Writing...');
                setBar(15, 'Step 1/3: Generating Script...');

                const scriptRes = await fetch('/api/script', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sourceInfo: titleInput || fileInput.name,
                        platform,
                        lang: 'Myanmar'
                    })
                });
                const scriptData = await scriptRes.json();

                if (!scriptRes.ok || !scriptData.script || scriptData.script.trim().length < 15) {
                    setStepBadge(1, 'err', '1. Script: Failed');
                    throw new Error(scriptData.error || 'Script မထွက်ပါ (API Key စစ်ဆေးပါ)');
                }

                const cleanText = scriptData.script
                    .replace(/\[HOOK\]|\[STORY\]|\[CLIFFHANGER\]|[#*🔥🎬⚡\[\]]/gi, '')
                    .trim();

                document.getElementById('scriptOutput').value = cleanText;
                document.getElementById('verifyBox').classList.remove('hidden');
                setStepBadge(1, 'ok', '1. Script: OK');

                const lines = cleanText
                    .split(/[\n။\.!?]+/)
                    .map(s => s.trim())
                    .filter(s => s.length > 2);

                // --- STEP 2: STRICT AUDIO VERIFICATION ---
                setStepBadge(2, 'running', '2. Audio: Generating...');
                setBar(40, 'Step 2/3: Generating Burmese Audio...');

                const ttsRes = await fetch(`/api/tts?voice=${encodeURIComponent(selectedVoice)}&text=${encodeURIComponent(lines.join('။ '))}`);
                if (!ttsRes.ok) {
                    const errJson = await ttsRes.json().catch(() => ({}));
                    setStepBadge(2, 'err', '2. Audio: Failed');
                    throw new Error(errJson.error || 'Audio မထွက်ပါ');
                }

                const audioArrayBuf = await ttsRes.arrayBuffer();
                if (!audioArrayBuf || audioArrayBuf.byteLength < 1000) {
                    setStepBadge(2, 'err', '2. Audio: Empty');
                    throw new Error('Audio ဖိုင် အလွတ်ဖြစ်နေပါသည်');
                }

                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const masterBuffer = await audioCtx.decodeAudioData(audioArrayBuf.slice(0));
                if (!masterBuffer || masterBuffer.duration < 1) {
                    setStepBadge(2, 'err', '2. Audio: Invalid');
                    throw new Error('Audio အချိန်တိုလွန်းနေပါသည်');
                }

                // Show playable audio immediately for user verification
                const verifyAudioBlob = new Blob([audioArrayBuf], { type: ttsRes.headers.get('Content-Type') || 'audio/wav' });
                document.getElementById('audioVerifyPlayer').src = URL.createObjectURL(verifyAudioBlob);
                document.getElementById('engineBadge').innerText = ttsRes.headers.get('X-TTS-Engine') || 'Synced';
                setStepBadge(2, 'ok', `2. Audio: OK (${Math.round(masterBuffer.duration)}s)`);

                // Build exact timeline
                const totalDur = masterBuffer.duration;
                const totalChars = lines.reduce((a, b) => a + b.length, 0);
                const timeline = [];
                let cursor = 0;
                lines.forEach((line, i) => {
                    const dur = (line.length / Math.max(1, totalChars)) * totalDur;
                    timeline.push({
                        text: line,
                        start: cursor,
                        end: cursor + dur,
                        ratio: i / Math.max(1, lines.length)
                    });
                    cursor += dur;
                });

                // --- STEP 3: FAST VIDEO MERGE WITH COUNTDOWN ---
                setStepBadge(3, 'running', '3. Render: Merging...');
                finalBlob = await renderVideoFast(fileInput, masterBuffer, audioCtx, timeline, platform, totalDur);

                setStepBadge(3, 'ok', '3. Render: Done');
                setBar(100, 'Completed');
                document.getElementById('finalPlayer').src = URL.createObjectURL(finalBlob);
                document.getElementById('outputSection').classList.remove('hidden');
                document.getElementById('outputSection').scrollIntoView({ behavior: 'smooth' });

            } catch (e) {
                setBar(0, 'Stopped: ' + e.message);
                alert(e.message);
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }

        function renderVideoFast(videoFile, audioBuffer, audioCtx, timeline, platform, totalDur) {
            return new Promise(async (resolve) => {
                const canvas = document.createElement('canvas');
                // Balanced HD resolution for fast mobile rendering
                if (platform === 'tiktok') {
                    canvas.width = 540;
                    canvas.height = 960;
                } else {
                    canvas.width = 960;
                    canvas.height = 540;
                }
                const ctx = canvas.getContext('2d');
                const srcVid = document.getElementById('srcVideo');

                let hasVid = false;
                let vidDur = 0;
                if (videoFile) {
                    if (!srcVid.src) srcVid.src = URL.createObjectURL(videoFile);
                    srcVid.loop = true;
                    if (srcVid.readyState >= 2) {
                        hasVid = true;
                        vidDur = srcVid.duration || 10;
                    } else {
                        await new Promise(r => {
                            srcVid.onloadedmetadata = () => { hasVid = true; vidDur = srcVid.duration || 10; r(); };
                            srcVid.onerror = () => r();
                        });
                    }
                    if (hasVid) await srcVid.play();
                }

                // 24fps cinematic frame rate speeds up encoding significantly
                const stream = canvas.captureStream(24);
                const dest = audioCtx.createMediaStreamDestination();
                const srcNode = audioCtx.createBufferSource();
                srcNode.buffer = audioBuffer;
                srcNode.connect(dest);

                const mixed = new MediaStream([...stream.getVideoTracks(), ...dest.stream.getAudioTracks()]);
                let mime = 'video/mp4';
                finalExt = 'mp4';
                if (!MediaRecorder.isTypeSupported('video/mp4')) {
                    mime = 'video/webm';
                    finalExt = 'webm';
                }

                const recorder = new MediaRecorder(mixed, { mimeType: mime, videoBitsPerSecond: 2500000 });
                const chunks = [];
                recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = () => {
                    if (hasVid) srcVid.pause();
                    resolve(new Blob(chunks, { type: mime }));
                };

                recorder.start();
                srcNode.start();

                const t0 = performance.now();
                let lastIdx = -1;

                const timer = setInterval(() => {
                    const elapsed = (performance.now() - t0) / 1000;
                    const remain = Math.max(0, Math.ceil(totalDur - elapsed));
                    const pct = Math.min(99, 65 + Math.round((elapsed / totalDur) * 34));
                    setBar(pct, `Step 3/3: Rendering Video (${remain}s left)...`);

                    if (elapsed >= totalDur) {
                        clearInterval(timer);
                        recorder.stop();
                        return;
                    }

                    let idx = timeline.findIndex(item => elapsed >= item.start && elapsed < item.end);
                    if (idx === -1) idx = timeline.length - 1;
                    const seg = timeline[idx];

                    if (idx !== lastIdx) {
                        lastIdx = idx;
                        if (hasVid && vidDur > 1) {
                            const target = Math.min(vidDur - 0.5, seg.ratio * vidDur);
                            if (Math.abs(srcVid.currentTime - target) > 1.2) {
                                srcVid.currentTime = target;
                            }
                        }
                    }

                    const prog = Math.min(1, (elapsed - seg.start) / Math.max(0.1, seg.end - seg.start));
                    const zoom = 1.05 + (prog * 0.06);
                    drawCompositeFrame(ctx, canvas, srcVid, platform, seg.text, zoom);
                }, 41); // ~24 FPS exact timer
            });
        }

        function downloadOutput() {
            if (!finalBlob) return;
            const url = URL.createObjectURL(finalBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Recap_${selectedVoice}.${finalExt}`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
        }

        // Initial preview render
        window.onload = () => updateLivePreview();
    </script>
</body>
</html>
