<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Myanmar Movie Recap Studio - Gemini Pro Audio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', 'Padauk', sans-serif;
            background: radial-gradient(circle at 15% 15%, #1e1b4b 0%, #090d16 45%, #030508 100%);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.78);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
        }
        .voice-card-active {
            background: linear-gradient(145deg, rgba(59, 130, 246, 0.3), rgba(147, 51, 234, 0.3)) !important;
            border: 1.5px solid #60a5fa !important;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }
        button { cursor: pointer; touch-action: manipulation; }
        .wave-bar {
            width: 3px; height: 12px; background: #60a5fa; border-radius: 99px;
            animation: soundWave 0.6s infinite ease-in-out alternate;
        }
        .wave-bar:nth-child(2) { animation-delay: 0.2s; height: 18px; }
        .wave-bar:nth-child(3) { animation-delay: 0.4s; height: 10px; }
        @keyframes soundWave { 0% { transform: scaleY(0.4); } 100% { transform: scaleY(1.3); } }
    </style>
</head>
